name: CI

# Reusable test workflow: called by test-on-pr.yml and docker.yml.
on:
  workflow_call:
    secrets:
      MTEAM_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'
  GOIMPORTS_VERSION: v0.49.0
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  NODE_VERSION: '26'
  PNPM_VERSION: '12.18.0'

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [protocol, backend, organizer]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}

      - name: Format check
        run: |
          test -z "$($(go env GOPATH)/bin/goimports -local github.com/autoget-project/autoget/${{ matrix.module }} -l .)"

      - name: Lint check
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}

      - name: Run ${{ matrix.module }} tests
        run: go test -race -v ./...
        env:
          CGO_ENABLED: '1'
          MTEAM_API_KEY: ${{ secrets.MTEAM_API_KEY }}

  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [protocol, backend, organizer]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Lint check
        run: pnpm run lint

      - name: Format check
        run: pnpm run fmt:check

      - name: Run tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

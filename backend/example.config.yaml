port: 8888
pg_dsn: user=pg password=your_password dbname=your_db host=db_ip port=5432 sslmode=disable

# Optional OAuth/OIDC login; omit this section to disable auth entirely.
# issuer must support OIDC discovery (.well-known/openid-configuration).
# The callback URL to register with the provider is:
#   {redirect_base_url}/auth/callback
auth:
  issuer: https://auth.example.com/oauth2
  client_id: your_client_id
  client_secret: your_client_secret
  redirect_base_url: https://autoget.example.com
  # required_role: autoget # optional: if set, JWT roles claim (space-separated) must contain this role
telegram:
  token: bot_token
  chat_id: your_chat_id
organizer_service: http://organizer_service
mteam:
  api_key: your_key
  # web_base_url: https://kp.m-team.cc # optional: site used for resource detail links (defaults to the public site)
  downloader: transmission
nyaa:
  downloader: transmission_vpn
sukebei:
  downloader: transmission_vpn
downloaders:
  transmission:
    transmission:
      url: http://transmission/transmission/rpc
      torrents_dir: "/tmp/torrents"
      download_dir: "/tmp/downloads"
      finished_dir: "/tmp/finished"
    seeding_policy:
      interval_in_days: 5
      upload_at_least_in_mb: 200
  transmission_vpn:
    transmission:
      url: http://transmission_vpn/transmission/rpc
      torrents_dir: "/tmp/torrents"
      download_dir: "/tmp/downloads"
      finished_dir: "/tmp/finished"

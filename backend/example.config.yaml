port: 8888
# Remote database: keep sslmode=require (or verify-full). sslmode=disable sends
# the password and data in cleartext; only use it on a private network such as
# the bundled docker-compose network (see docker-compose.example.yml).
# This file holds plaintext secrets (pg_dsn password, client_secret, api_key,
# telegram token): chmod 600, never commit it. See README.md, "Secrets".
pg_dsn: user=pg password=your_password dbname=your_db host=db_ip port=5432 sslmode=require

# REQUIRED. The backend refuses to start without an auth section.
# To run with NO authentication (the whole API open to anyone who can reach the
# port), you must opt out explicitly with only:
#   auth:
#     disabled: true
# Otherwise configure OAuth/OIDC login as below.
# issuer must support OIDC discovery (.well-known/openid-configuration) and
# offline_access, and must issue JWT access tokens whose aud includes client_id
# (see backend/README.md, "OIDC provider requirements").
# The callback URL to register with the provider is:
#   {redirect_base_url}/auth/callback
auth:
  issuer: https://auth.example.com/oauth2
  client_id: your_client_id
  client_secret: your_client_secret
  redirect_base_url: https://autoget.example.com
  # required_role: autoget # optional: if set, JWT roles claim (space-separated) must contain this role, else requests get 403
telegram:
  token: bot_token
  chat_id: your_chat_id
organizer_service: http://organizer_service
mteam:
  api_key: your_key
  # web_base_url: https://kp.m-team.cc # optional: site used for resource detail links (defaults to the public site)
  downloader: transmission
nyaa:
  downloader: transmission_vpn
sukebei:
  downloader: transmission_vpn
downloaders:
  transmission:
    transmission:
      url: http://transmission/transmission/rpc
      torrents_dir: "/tmp/torrents"
      download_dir: "/tmp/downloads"
      finished_dir: "/tmp/finished"
    seeding_policy:
      interval_in_days: 5
      upload_at_least_in_mb: 200
  transmission_vpn:
    transmission:
      url: http://transmission_vpn/transmission/rpc
      torrents_dir: "/tmp/torrents"
      download_dir: "/tmp/downloads"
      finished_dir: "/tmp/finished"
